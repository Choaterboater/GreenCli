name: CI

# Test/lint gate for every push to main and every PR. The release workflow
# builds installers but never runs the test suite — this is the safety net.
on:
  push:
    branches: [main]
  pull_request:
  # release.yml runs this whole workflow first, so a tag can't ship code that
  # never passed it.
  workflow_call:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npx vitest run

      # The production bundle must actually mount: a chunk evaluation-order
      # bug in the minified build shipped a white screen in v1.2.1, and only
      # this check (scripts/prod-smoke.mjs) sees that class of failure.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Production smoke test
        run: npm run smoke

  rust:
    # Tauri 2 uses webkit2gtk-4.1 (2.40+) / libsoup 3: ubuntu-24.04 (22.04 also works).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # Tauri links against webkit2gtk-4.1 (and libsoup 3) even for
      # `cargo test`; the serialport crate needs libudev.pc (CI-3:
      # libudev-sys build script panics without it).
      # keyring's Secret Service support needs libdbus-1 and pkg-config.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libudev-dev libdbus-1-dev pkg-config

      # generate_context!() validates the frontend bundle at compile time and
      # panics if ../dist doesn't exist, so the rust gate needs a real build
      # (CI-2). A stash/mkdir stub would mask what a real build needs.
      - name: Build frontend bundle
        run: |
          npm ci
          npm run build

      # Non-blocking for now: the tree predates a fmt gate, so a strict check
      # could be red on untouched code. Flip to required once the baseline is
      # formatted (or once clippy/tests prove the gate useful).
      - name: Format check
        run: cargo fmt --check
        working-directory: src-tauri
        continue-on-error: true

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: src-tauri

      - name: Tests
        run: cargo test --workspace
        working-directory: src-tauri

  rust-windows:
    # The Linux job never compiles the Windows side of #[cfg(unix)] code
    # (file permissions, private_fs, the live show named pipe), which
    # release.yml ships. The whole Rust and unit test suites run here too, so
    # a Windows break shows up before a tag does.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # generate_context!() needs ../dist at compile time (see the rust job).
      - name: Build frontend bundle
        run: |
          npm ci
          npm run build

      - name: Unit tests
        run: npx vitest run

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: src-tauri

      # All of them: the updater's platform name, both ends of the live show
      # named pipe, greencli-mcp's source scan, and the Windows paths.
      - name: Tests
        run: cargo test --workspace
        working-directory: src-tauri

      # The real app, not a mock: a debug build with its own app id and a
      # throwaway home folder. Its window renders, it offers a fake Claude
      # Desktop config's servers, and greencli-mcp reaches it over the named
      # pipe (and refuses a pipe without the secret after a crash).
      - name: App check (real window and named pipe)
        run: node scripts/windows-app-check.mjs --build
