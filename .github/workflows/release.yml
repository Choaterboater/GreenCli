name: Release

# Builds installers for macOS (.dmg/.app) and Windows (.msi/.exe NSIS) and
# uploads them to a draft GitHub Release. Triggered by pushing a v* tag, or
# manually via the Actions tab.
#
# The Mac app is signed and notarized by Apple only when the Apple secrets are
# set (see "Check the Apple secrets" below, and "Apple signing (optional)" in
# docs/SETUP.md). Without them it builds unsigned, and the build still passes.
#
# Update files are signed automatically. Nobody keeps an update signing key
# and there are no update signing secrets:
# - Each build job makes its own one-time key pair with the Tauri CLI that
#   `npm ci` installed (locked in package-lock.json), signs its update files
#   with it, and adds the public half to the same draft release as
#   update-key-<os>-<arch>.pub. The private half is a file under $RUNNER_TEMP
#   that only tauri-action reads, and it is deleted right after the build.
# - The app reads the version from the latest release's latest.json, then
#   takes the manifest and the key from that same release (tag v<version>)
#   and checks each download against that key (src-tauri/src/updater.rs).
# - The update-files job writes latest.json and checks the whole draft before
#   the owner publishes it.
#
# The three build jobs run at the same time, so none of them looks up or
# makes the draft, and none writes latest.json: two builds that finished
# together could each make their own draft, or drop each other's entries
# from latest.json. The release job finds or makes the draft once and the
# builds upload into it by its id; update-files writes latest.json once,
# after all three builds.
#
# No run changes a published release. The release job only uses a draft,
# and every step that uploads into the release or deletes a file from it
# first checks that it is still a draft (a re-run of one job gets the id
# the release job found the first time, and the owner may have published
# that release since). A published release needs a new version.
on:
  push:
    tags:
      - "v*"
    # Pushing a release/* branch also builds — the escape hatch for
    # environments whose credentials can push branches but not tags or
    # workflow_dispatch. The release lands under the app's real version
    # (v__VERSION__ below), not the branch name. Publishing that draft
    # creates the tag, and the run that tag push starts is skipped (see the
    # gate job).
    branches:
      - "release/**"
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload to a draft GitHub Release (off: build only, installers kept as workflow artifacts)"
        type: boolean
        default: true

# Read-only by default; only release (which makes the draft), the build jobs
# (which upload into it) and update-files (which writes latest.json) get
# write.
permissions:
  contents: read

jobs:
  # Publishing a draft made by a release/** push or a manual run creates its
  # tag, and that tag push starts this workflow again. The release job uses
  # only a draft, never a published release, so that run would build
  # everything again into a second v<version> draft. So a tag push whose tag
  # already has a published release builds nothing. GitHub's release-by-tag
  # call sees only published releases, never drafts: a tag pushed before its
  # release is published still builds, and so does a run where the call
  # fails. Manual runs and release/** pushes are never skipped.
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Skip a tag that is already published
        id: check
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "::notice::$GITHUB_REF_NAME is already published, so there is nothing to build."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

  # The full test/lint run (ci.yml) must pass before any installer is built.
  # When the gate job skips it, the jobs after it (which need it) skip too.
  ci:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # The one job that finds or makes the draft release. The three builds
  # (which start uploading at the same time) all upload into it by its id.
  # - The tag is the pushed tag, or v<app version> (tauri.conf.json) for a
  #   release/** push or a manual run: the app looks for the tag v<version>.
  # - A draft with that tag is used again (a re-run uploads into it); with
  #   none, it makes one. GitHub's release-by-tag call never returns drafts,
  #   so it looks through the list of releases.
  # - For a release/** push or a manual run, the tag doesn't exist until the
  #   draft is published, and GitHub then makes it at the draft's target.
  #   So such a run points a draft it uses again at its own commit (after a
  #   fix pushed to the same release/** branch, say), keeping its tag name:
  #   the tag must be the commit that was built. A tag push needs nothing:
  #   its tag is there.
  # - Always a draft: no CI run can make a release "latest" by itself. The
  #   owner publishes the draft by hand.
  # Publishing is on for tag and release/** pushes, and for manual runs
  # unless "publish" is unticked. The test is
  #   github.event_name != 'workflow_dispatch' || inputs.publish
  # because `inputs.publish` is null on push events. A build-only run skips
  # the step, so the id is empty and the builds upload nothing (the
  # installers become workflow artifacts).
  # Why manual runs can turn it off: a run builds under the app's current
  # version, so before the version bump it would make a second draft with
  # the same tag as the already published release (e.g. v1.9.0). No job
  # changes a published release (see the top of this file), but the extra
  # draft is confusing: untick publish to only build. A release/** push
  # always publishes: push one only after the bump.
  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      id: ${{ steps.draft.outputs.id }}
      tag: ${{ steps.draft.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Find or make the draft release
        id: draft
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = tag ]; then tag="$REF_NAME"; else tag="v$(jq -r .version src-tauri/tauri.conf.json)"; fi
          ids=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
            jq -r --arg tag "$tag" '.[] | select(.draft == true and .tag_name == $tag) | .id')
          count=$(printf '%s' "$ids" | wc -w | tr -d ' ')
          if [ "$count" -gt 1 ]; then
            echo "::error::There are $count draft releases for $tag. Delete all but one of them, then run this again."
            exit 1
          elif [ "$count" -eq 1 ]; then
            id=$ids
            echo "Uploading into the $tag draft."
            # For a release/** push or a manual run the tag doesn't exist
            # yet: publishing makes it at the draft's target. Point that at
            # this run's commit, the one it builds, not the commit of the
            # run that made the draft. Name the tag in the same call: GitHub
            # drops the tag of a draft edited without tag_name (it becomes
            # untagged-...), and then neither the app nor the next run would
            # find this draft.
            if [ "$REF_TYPE" != tag ]; then
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" \
                -f tag_name="$tag" -f target_commitish="$GITHUB_SHA" > /dev/null
              echo "Pointed the $tag draft at $GITHUB_SHA."
            fi
          else
            id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$tag" \
              -f name="GreenCli $tag" -F draft=true -F prerelease=false \
              -f target_commitish="$GITHUB_SHA" --jq .id)
            echo "Made the $tag draft."
          fi
          case "$id" in
            "" | *[!0-9]*) echo "::error::GitHub gave no release id for $tag."; exit 1 ;;
          esac
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: release
    # tauri-action uploads the installers into the release job's draft.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon + Intel macOS
          # `updater` is the <os>-<arch> name Tauri uses in latest.json; the
          # build's public key is published as update-key-<updater>.pub.
          # (updater.rs tests check these names against the app's.)
          - platform: macos-latest
            target: aarch64-apple-darwin
            updater: darwin-aarch64
          - platform: macos-latest
            target: x86_64-apple-darwin
            updater: darwin-x86_64
          # Windows x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            updater: windows-x86_64

    runs-on: ${{ matrix.platform }}

    steps:
      # Re-running one build job (or "Re-run failed jobs") does not run the
      # release job again: this job gets the id it found the first time,
      # and the owner may have published that release since. Then stop
      # before anything is built: tauri-action, "Notarize the .dmg" and
      # "Publish the update key" would swap the published release's update
      # file and key for new ones, and its latest.json would point at a
      # deleted file until update-files ran again (and for good if this run
      # failed first). The steps that delete a file from the release check
      # again, because the owner could publish while the build runs. A
      # build-only run has no id, so there is nothing to check.
      - name: Stop if the release is already published
        if: ${{ needs.release.outputs.id != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.release.outputs.id }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          draft=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq .draft)
          if [ "$draft" != true ]; then
            echo "::error::The $TAG release is already published, so this run won't change it. Release a new version instead."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      # A one-time update signing key for this build only, made by the Tauri
      # CLI that `npm ci` just installed from package-lock.json (--no-install:
      # never a package fetched at run time). The private key is a file under
      # $RUNNER_TEMP, outside the checkout: tauri-action gets only its path,
      # nothing prints it or puts it in env, outputs or artifacts, and it is
      # deleted right after the build. It has no password: it never leaves
      # this job, and the Tauri CLI makes and reads it with an empty one in CI.
      - name: Make a one-time update signing key
        id: keygen
        shell: bash
        run: |
          set -euo pipefail
          # Forward slashes: the paths also go into tauri-action's args on Windows.
          dir="${RUNNER_TEMP//\\//}/greencli-update-key"
          rm -rf "$dir" && mkdir -p "$dir" && chmod 700 "$dir"
          npx --no-install tauri signer generate --ci -w "$dir/updkey" > /dev/null
          # Update files for this build only (tauri.conf.json keeps them off),
          # with this build's public key: Tauri signs only when a public key
          # is set, and checks the private key against it.
          printf '{"bundle":{"createUpdaterArtifacts":true},"plugins":{"updater":{"pubkey":"%s"}}}\n' \
            "$(cat "$dir/updkey.pub")" > "$dir/updater.conf.json"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      # Apple signing for the Mac app (macOS jobs only). It turns on by itself
      # when these repo secrets are set (docs/SETUP.md, "Apple signing
      # (optional)"):
      #   APPLE_CERTIFICATE           base64 of the Developer ID Application .p12
      #   APPLE_CERTIFICATE_PASSWORD  the password of that .p12
      #   APPLE_API_ISSUER            App Store Connect API key: Issuer ID
      #   APPLE_API_KEY               App Store Connect API key: Key ID
      #   APPLE_API_KEY_P8            the text of the AuthKey_<Key ID>.p8 file
      # - All five: signed and notarized (mode "notarize").
      # - None: not signed (mode "off"), with a notice.
      # - Only the certificate and its password: signed, not notarized (mode
      #   "sign"), with a warning that names the missing secrets. This is how
      #   1.x was built, so a repo that still has only those two keeps signed
      #   Mac apps.
      # - Any other mix: not signed (mode "off"), with a warning that names
      #   the missing secrets.
      # The build passes in every case.
      #
      # The Tauri bundler counts a variable that is set but empty as set: an
      # empty APPLE_CERTIFICATE makes it import an empty certificate and fail,
      # and empty APPLE_API_* make it try to notarize with no key. So each mode
      # has its own build step below, and a build without Apple signing gets
      # no APPLE_* variable at all. This step sees only true or false, never a
      # secret, and its only output is the mode.
      # The bundler takes the signing name from the certificate, so there is
      # no APPLE_SIGNING_IDENTITY (an old secret of that name is not used).
      - name: Check the Apple secrets
        id: apple
        if: runner.os == 'macOS'
        shell: bash
        env:
          HAS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' }}
          HAS_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD != '' }}
          HAS_APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER != '' }}
          HAS_APPLE_API_KEY: ${{ secrets.APPLE_API_KEY != '' }}
          HAS_APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 != '' }}
        run: |
          set -euo pipefail
          missing=""
          count=0
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD \
              APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_P8; do
            has="HAS_$name"
            if [ "${!has}" != true ]; then
              missing="$missing${missing:+, }$name"
              count=$((count + 1))
            fi
          done
          see='See "Apple signing (optional)" in docs/SETUP.md.'
          if [ "$count" -eq 0 ]; then
            mode=notarize
            echo "Apple signing is on: the Mac app is signed and notarized."
          elif [ "$count" -eq 5 ]; then
            mode=off
            echo "::notice::No Apple secrets are set, so the Mac app is not signed. $see"
          elif [ "$HAS_APPLE_CERTIFICATE" = true ] && [ "$HAS_APPLE_CERTIFICATE_PASSWORD" = true ]; then
            mode=sign
            echo "::warning::The Mac app is signed but not notarized. Missing secrets: $missing. $see"
          else
            mode=off
            echo "::warning::The Mac app is not signed. Missing secrets: $missing. $see"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      # Notarizing only: notarytool reads the API key from a file. It goes
      # under $RUNNER_TEMP, outside the checkout, readable only by this user,
      # and "Delete the notarization key" removes it after the build, even
      # when a step failed. Then one quick call to Apple with the key, so a
      # wrong key shows Apple's own error here, before the long build.
      - name: Write the notarization key
        if: steps.apple.outputs.mode == 'notarize'
        shell: bash
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/greencli-apple-key"
          rm -rf "$dir" && mkdir -p "$dir" && chmod 700 "$dir"
          (umask 077 && printf '%s\n' "$APPLE_API_KEY_P8" > "$dir/AuthKey.p8")
          if ! grep -q -e '-----BEGIN PRIVATE KEY-----' "$dir/AuthKey.p8"; then
            echo "::error::APPLE_API_KEY_P8 must be the whole text of the .p8 file, from the BEGIN PRIVATE KEY line to the END PRIVATE KEY line."
            exit 1
          fi
          if ! xcrun notarytool history --key "$dir/AuthKey.p8" \
              --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" > /dev/null; then
            echo "::error::Apple did not accept the API key. Check APPLE_API_ISSUER, APPLE_API_KEY and APPLE_API_KEY_P8, and that the key is a Team key with Developer access or higher (see docs/SETUP.md)."
            exit 1
          fi
          echo "Apple accepted the API key."

      # Exactly one of the next three build steps runs: this one on Windows
      # and for an unsigned Mac app, the other two for Apple signing. All
      # three use the same settings (the `with:` block, shared by name).
      - name: Build + bundle (tauri-action)
        id: tauri
        if: runner.os != 'macOS' || steps.apple.outputs.mode == 'off'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS runners have 7 GB RAM, so Node 20 sizes its default old-space
          # heap near 2 GB and `vite build` (the beforeBuildCommand) aborts with
          # "JavaScript heap out of memory". Linux/Windows runners have 16 GB and
          # get a 4 GB default, which is why only the macOS legs failed.
          NODE_OPTIONS: --max-old-space-size=4096
          # Windows code signing:
          # WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          # WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          # This build's one-time update key: a file path, never the key
          # itself, and no password (see "Make a one-time update signing key").
          TAURI_SIGNING_PRIVATE_KEY: ${{ steps.keygen.outputs.dir }}/updkey
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with: &tauri-with
          # The Tauri app lives at the repo root (this `project/` folder).
          # Uploads go into the release job's draft, by its id. There is no
          # tagName, so tauri-action never looks up or makes a release
          # itself. On a build-only run the id is empty, so nothing is
          # uploaded to any release (the installers become workflow
          # artifacts below).
          releaseId: ${{ needs.release.outputs.id }}
          # Each update file goes into the release with its .sig
          # (uploadUpdaterSignatures is on by default), but not latest.json:
          # tauri-action would read it, add this build's platforms and write
          # it back, and two builds that finish together can drop each
          # other's entries. update-files writes it after all three builds.
          uploadUpdaterJson: false
          args: --target ${{ matrix.target }} --config ${{ steps.keygen.outputs.dir }}/updater.conf.json

      # Signed with the Developer ID certificate, not notarized. The bundler
      # signs GreenCLI and greencli-mcp (both in Contents/MacOS) and then the
      # app, all with the hardened runtime, and makes the .dmg and the update
      # file from the signed app.
      - name: Build + bundle, signed (tauri-action)
        id: tauri_signed
        if: steps.apple.outputs.mode == 'sign'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=4096
          TAURI_SIGNING_PRIVATE_KEY: ${{ steps.keygen.outputs.dir }}/updkey
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        with: *tauri-with

      # Signed as above, then sent to Apple to notarize. The bundler waits
      # for Apple and staples the ticket to the app (one try; see "Check the
      # Mac app") before it makes the .dmg and the update file, so both hold
      # the notarized app.
      - name: Build + bundle, signed and notarized (tauri-action)
        id: tauri_notarized
        if: steps.apple.outputs.mode == 'notarize'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=4096
          TAURI_SIGNING_PRIVATE_KEY: ${{ steps.keygen.outputs.dir }}/updkey
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          # The file "Write the notarization key" made.
          APPLE_API_KEY_PATH: ${{ runner.temp }}/greencli-apple-key/AuthKey.p8
        with: *tauri-with

      # The private key is only needed by the build: delete it now, even when
      # a step failed. The public half stays for "Check the update
      # signatures" and "Publish the update key".
      - name: Delete the update signing key
        if: always()
        shell: bash
        run: rm -f "${RUNNER_TEMP//\\//}/greencli-update-key/updkey"

      # Notarizing only. The bundler notarizes the app inside the .dmg, but
      # not the .dmg itself, and macOS checks the .dmg when a user opens the
      # download. So send the .dmg to Apple too, staple the ticket to it, and
      # put the stapled .dmg in the release in place of the one tauri-action
      # uploaded (build only: the stapled .dmg is kept as a workflow
      # artifact below).
      - name: Notarize the .dmg
        if: steps.apple.outputs.mode == 'notarize'
        shell: bash
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
          # The release job's draft, where tauri-action uploaded the .dmg.
          RELEASE_ID: ${{ needs.release.outputs.id }}
          TAG: ${{ needs.release.outputs.tag }}
          BUNDLE: src-tauri/target/${{ matrix.target }}/release/bundle
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/greencli-apple-key/AuthKey.p8"
          set -- "$BUNDLE"/dmg/*.dmg
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "::error::Expected one .dmg in $BUNDLE/dmg."
            exit 1
          fi
          dmg=$1
          name=$(basename "$dmg")
          echo "Sending $name to Apple (this can take a few minutes)..."
          out=$(xcrun notarytool submit "$dmg" --key "$key" --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" --wait --timeout 1h --output-format json) || true
          # notarytool's JSON answer: {"id": ..., "status": ..., "message": ...}
          status=$(node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).status || ""' \
            <<<"$out" 2>/dev/null) || status=""
          if [ "$status" != Accepted ]; then
            echo "::error::Apple did not notarize $name (status: ${status:-none})."
            id=$(node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).id || ""' \
              <<<"$out" 2>/dev/null) || id=""
            if [ -n "$id" ]; then
              xcrun notarytool log "$id" --key "$key" --key-id "$APPLE_API_KEY" \
                --issuer "$APPLE_API_ISSUER" || true
            fi
            exit 1
          fi
          # Apple's ticket can take a little while to show up after
          # "Accepted" (stapler then says "Record not found", error 65), so
          # try a few times before failing the job.
          for i in 1 2 3 4 5; do
            xcrun stapler staple "$dmg" && break
            if [ "$i" = 5 ]; then echo "::error::Could not staple Apple's ticket to $name."; exit 1; fi
            echo "Apple's ticket is not available yet; trying again in 30s..."
            sleep 30
          done
          echo "Apple notarized $name, and its ticket is stapled."
          if [ "$PUBLISH" != true ]; then exit 0; fi
          test -n "$RELEASE_ID"
          # Still a draft? (See "Stop if the release is already published".)
          draft=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq .draft)
          if [ "$draft" != true ]; then
            echo "::error::The $TAG release is already published, so this run won't change it. Release a new version instead."
            exit 1
          fi
          ids=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --paginate \
            --jq ".[] | select(.name == \"$name\") | .id")
          found=$(printf '%s' "$ids" | wc -w | tr -d ' ')
          if [ "$found" != 1 ]; then
            echo "::error::The release should have one $name, but has $found."
            exit 1
          fi
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$ids"
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@$dmg" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$name" > /dev/null
          echo "The release now has the stapled $name."

      # The notarization key is only needed above: delete it now, even when
      # a step failed.
      - name: Delete the notarization key
        if: always() && runner.os == 'macOS'
        shell: bash
        run: rm -rf "$RUNNER_TEMP/greencli-apple-key"

      # The Mac app must hold greencli-mcp. With Apple signing on, both
      # programs in it must carry the Developer ID signature with the hardened
      # runtime (Apple's notary refuses anything less), and a notarized .dmg
      # must carry Apple's ticket. A problem fails a notarized build; a
      # signed-only build gets a warning.
      # A notarized app with no stapled ticket is only a warning: the bundler
      # staples the app once, right after Apple says "Accepted", and goes on
      # when that fails (Apple's ticket can lag behind, the same delay "Notarize
      # the .dmg" retries for). The .dmg and the update file are already made
      # from that app, so stapling it here would not reach them. Apple did
      # notarize it: Gatekeeper checks online, and the stapled .dmg covers the
      # app inside it.
      - name: Check the Mac app
        if: runner.os == 'macOS'
        shell: bash
        env:
          BUNDLE: src-tauri/target/${{ matrix.target }}/release/bundle
          MODE: ${{ steps.apple.outputs.mode }}
        run: |
          set -euo pipefail
          app="$BUNDLE/macos/GreenCLI.app"
          for exe in GreenCLI greencli-mcp; do
            if [ ! -x "$app/Contents/MacOS/$exe" ]; then
              echo "::error::The Mac app has no Contents/MacOS/$exe."
              exit 1
            fi
          done
          if [ "$MODE" = off ]; then
            echo "The Mac app holds greencli-mcp. It is not signed (no Apple signing)."
            exit 0
          fi
          problem() {
            if [ "$MODE" = notarize ]; then echo "::error::$1"; exit 1; fi
            echo "::warning::$1"
          }
          codesign --verify --strict --deep "$app" || problem "The Mac app's signature is not valid."
          for exe in GreenCLI greencli-mcp; do
            info=$(codesign -d --verbose=2 "$app/Contents/MacOS/$exe" 2>&1) || true
            grep -q '^Authority=Developer ID Application:' <<<"$info" ||
              problem "$exe is not signed with a Developer ID Application certificate."
            grep -Eq '^CodeDirectory .*flags=0x[0-9a-f]+\([^)]*runtime' <<<"$info" ||
              problem "$exe is signed without the hardened runtime."
          done
          if [ "$MODE" = sign ]; then
            echo "The Mac app is signed (not notarized)."
            exit 0
          fi
          xcrun stapler validate "$app" > /dev/null ||
            echo "::warning::The Mac app has no stapled ticket. Apple notarized it, but the bundler's one try to staple the ticket failed (most likely Apple's ticket delay). Gatekeeper checks online, and the stapled .dmg covers the app inside it."
          for dmg in "$BUNDLE"/dmg/*.dmg; do
            xcrun stapler validate "$dmg" > /dev/null || problem "$(basename "$dmg") has no notarization ticket."
          done
          echo "The Mac app and the .dmg are signed and notarized."

      # Every update file must match this build's key before the key is published.
      - name: Check the update signatures
        shell: bash
        run: >-
          node scripts/update-signature.mjs verify-dir
          "src-tauri/target/${{ matrix.target }}/release/bundle"
          "${{ steps.keygen.outputs.dir }}/updkey.pub"

      # The public half goes into the release as update-key-<os>-<arch>.pub.
      - name: Publish the update key
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The release job's draft, where the build uploaded its files.
          RELEASE_ID: ${{ needs.release.outputs.id }}
          TAG: ${{ needs.release.outputs.tag }}
          KEY_NAME: update-key-${{ matrix.updater }}.pub
          KEY_FILE: ${{ steps.keygen.outputs.dir }}/updkey.pub
        run: |
          set -euo pipefail
          test -n "$RELEASE_ID"
          # Still a draft? (See "Stop if the release is already published".)
          draft=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq .draft)
          if [ "$draft" != true ]; then
            echo "::error::The $TAG release is already published, so this run won't change it. Release a new version instead."
            exit 1
          fi
          # A re-run makes a new key: replace the old file.
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --paginate \
              --jq ".[] | select(.name == \"$KEY_NAME\") | .id"); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id"
          done
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@$KEY_FILE" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$KEY_NAME" > /dev/null
          echo "Published $KEY_NAME"

      # Build only: keep the installers as workflow artifacts instead.
      - name: Keep installers (build only)
        if: ${{ !(github.event_name != 'workflow_dispatch' || inputs.publish) }}
        uses: actions/upload-artifact@v4
        with:
          name: greencli-${{ matrix.target }}
          # upload-artifact drops the execute bit (every file comes back 644),
          # so a raw GreenCLI.app would not start. Keep the .dmg and the
          # .app.tar.gz, which keep it inside them.
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**
            !src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app/**
          if-no-files-found: error

  # After all three builds: writes latest.json into the release job's draft,
  # then checks the draft. latest.json must be for this tag (v<version>) and
  # list every platform, every entry must point at a file of this release,
  # and every signature must match its file, the key published for its
  # platform in this release, and the version. This catches a build mistake
  # before anyone can update to it. Publish the draft only when this is
  # green. (If a build job is re-run, it makes a new key and new files: make
  # sure this job runs again too and is green. It writes latest.json again
  # from the files the draft has then. Once the release is published, this
  # job stops without changing it, like the build jobs.)
  update-files:
    needs: [release, build]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
    runs-on: ubuntu-latest
    # Writes latest.json into the draft (and drafts are only visible with
    # write access).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The only writer of latest.json. Each build uploaded its update files
      # with their .sig files; this writes one entry per update file, the
      # same entries tauri-action writes (scripts/update-signature.mjs
      # latest-json), and puts it in place of any older latest.json.
      - name: Write latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.release.outputs.id }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_ID"
          # Still a draft? (See "Stop if the release is already published".)
          draft=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq .draft)
          if [ "$draft" != true ]; then
            echo "::error::The $TAG release is already published, so this run won't change it. Release a new version instead."
            exit 1
          fi
          version=$(jq -r .version src-tauri/tauri.conf.json)
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" > "$RUNNER_TEMP/assets.json"
          sigs="$RUNNER_TEMP/sigs"
          mkdir -p "$sigs"
          jq -r '.[] | select(.name | endswith(".sig")) | "\(.id) \(.name)"' "$RUNNER_TEMP/assets.json" > "$RUNNER_TEMP/sigs.txt"
          while read -r aid name; do
            gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$aid" > "$sigs/$name"
          done < "$RUNNER_TEMP/sigs.txt"
          node scripts/update-signature.mjs latest-json "$RUNNER_TEMP/assets.json" "$sigs" \
            "$GITHUB_REPOSITORY" "$version" > "$RUNNER_TEMP/latest.json"
          for aid in $(jq -r '.[] | select(.name == "latest.json") | .id' "$RUNNER_TEMP/assets.json"); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$aid"
          done
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/latest.json" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=latest.json" > /dev/null
          echo "Wrote latest.json for $version."

      - name: Check latest.json and the update signatures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.release.outputs.id }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_ID"
          test -n "$TAG"
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" > "$RUNNER_TEMP/assets.json"
          dir="$RUNNER_TEMP/release"
          mkdir -p "$dir"
          get() {
            local aid
            aid=$(jq -r --arg n "$1" '[.[] | select(.name == $n)][0].id // empty' "$RUNNER_TEMP/assets.json")
            if [ -z "$aid" ]; then echo "::error::The $TAG release has no $1"; exit 1; fi
            gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$aid" > "$dir/$1"
          }
          get latest.json
          for p in darwin-aarch64 darwin-x86_64 windows-x86_64; do get "update-key-$p.pub"; done
          node scripts/update-signature.mjs release-files "$dir/latest.json" \
            "$RUNNER_TEMP/assets.json" "$GITHUB_REPOSITORY" "$TAG" > "$RUNNER_TEMP/files.txt"
          while read -r f; do get "$f"; done < "$RUNNER_TEMP/files.txt"
          node scripts/update-signature.mjs check-release "$dir" \
            "$RUNNER_TEMP/assets.json" "$GITHUB_REPOSITORY" "$TAG" \
            darwin-aarch64 darwin-aarch64-app darwin-x86_64 darwin-x86_64-app \
            windows-x86_64 windows-x86_64-msi windows-x86_64-nsis
