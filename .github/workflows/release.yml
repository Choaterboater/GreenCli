name: Release

# Builds signed-able installers for macOS (.dmg/.app) and Windows (.msi/.exe NSIS)
# and uploads them to a draft GitHub Release. Triggered by pushing a v* tag, or
# manually via the Actions tab.
on:
  push:
    tags:
      - "v*"
    # Pushing a release/* branch also builds — the escape hatch for
    # environments whose credentials can push branches but not tags or
    # workflow_dispatch. The release lands under the app's real version
    # (v__VERSION__ below), not the branch name.
    branches:
      - "release/**"
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload to a draft GitHub Release (off: build only, installers kept as workflow artifacts)"
        type: boolean
        default: true

# Read-only by default; only the job that uploads to the release gets write.
permissions:
  contents: read

jobs:
  # The full test/lint gate (ci.yml) must pass before any installer is built.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: ci
    # tauri-action creates the draft release and uploads the installers.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon + Intel macOS
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          # Windows x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      # NOTARIZATION TEMPORARILY DISABLED (2026-06-06): the APPLE_ID /
      # APPLE_PASSWORD secrets fail Apple auth with HTTP 401 (APPLE_PASSWORD is
      # 20 chars; an app-specific password is exactly 19: xxxx-xxxx-xxxx-xxxx).
      # Apps are still SIGNED with the Developer ID cert — users just have to
      # approve the first launch via System Settings > Privacy & Security.
      #
      # To re-enable: regenerate an app-specific password at account.apple.com,
      # re-set the APPLE_ID and APPLE_PASSWORD repo secrets (from the
      # Choaterboater account), then uncomment this preflight step AND the
      # three APPLE_ID/APPLE_PASSWORD/APPLE_TEAM_ID env lines on the
      # tauri-action step below.
      #
      # The Tauri bundler can hide notarytool's real stderr behind a generic
      # "failed to upload app to Apple's notarization servers." — this step
      # validates the Apple ID / app-specific password / Team ID triple up
      # front so the actual Apple error (e.g. HTTP 401) shows in the log.
      # Values are passed via env and never echoed; only lengths are printed.
      # - name: Preflight - validate Apple notarization credentials
      #   if: runner.os == 'macOS'
      #   env:
      #     APPLE_ID: ${{ secrets.APPLE_ID }}
      #     APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      #     APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      #   run: |
      #     set -euo pipefail
      #     : "${APPLE_ID:?APPLE_ID secret is empty or unset}"
      #     : "${APPLE_PASSWORD:?APPLE_PASSWORD secret is empty or unset}"
      #     : "${APPLE_TEAM_ID:?APPLE_TEAM_ID secret is empty or unset}"
      #     echo "APPLE_ID length: ${#APPLE_ID}; APPLE_PASSWORD length: ${#APPLE_PASSWORD} (expect 19); APPLE_TEAM_ID length: ${#APPLE_TEAM_ID} (expect 10)"
      #     # Real auth round-trip with Apple; prints Apple's native error on failure.
      #     xcrun notarytool history \
      #       --apple-id "$APPLE_ID" \
      #       --password "$APPLE_PASSWORD" \
      #       --team-id "$APPLE_TEAM_ID"
      #     echo "Notarization credentials validated successfully."

      - name: Build + bundle (tauri-action)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS runners have 7 GB RAM, so Node 20 sizes its default old-space
          # heap near 2 GB and `vite build` (the beforeBuildCommand) aborts with
          # "JavaScript heap out of memory". Linux/Windows runners have 16 GB and
          # get a 4 GB default, which is why only the macOS legs failed.
          NODE_OPTIONS: --max-old-space-size=4096
          # macOS signing (notarization disabled — see comment above; presence
          # of APPLE_ID/APPLE_PASSWORD is what makes Tauri attempt notarization)
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows code signing:
          # WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          # WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          # The Tauri app lives at the repo root (this `project/` folder).
          # Publishing is on for tag and release/** pushes, and for manual
          # runs unless "publish" is unticked. The test is
          #   github.event_name != 'workflow_dispatch' || inputs.publish
          # because `inputs.publish` is null on push events. With publishing
          # off, tagName and releaseName are empty, so nothing is uploaded to
          # any release (the installers become workflow artifacts below).
          # Why manual runs can turn it off: a run builds under the app's
          # current version (tauri-action substitutes __VERSION__ from
          # tauri.conf.json), so before the version bump it would make a
          # second draft release with the same tag as the already published
          # one (e.g. v1.9.0). tauri-action v1 never changes a published
          # release, but the extra draft is confusing: untick publish to only
          # build.
          # A release/** push always publishes: push one only after the bump.
          tagName: ${{ (github.event_name != 'workflow_dispatch' || inputs.publish) && (github.ref_type == 'tag' && github.ref_name || 'v__VERSION__') || '' }}
          releaseName: ${{ (github.event_name != 'workflow_dispatch' || inputs.publish) && (github.ref_type == 'tag' && format('GreenCli {0}', github.ref_name) || 'GreenCli v__VERSION__') || '' }}
          # Always a draft: no CI run can make a release "latest" by itself.
          # The owner publishes the draft by hand.
          releaseDraft: true
          prerelease: false
          # No update files yet (createUpdaterArtifacts is off in tauri.conf.json).
          uploadUpdaterJson: false
          args: --target ${{ matrix.target }}

      # Build only: keep the installers as workflow artifacts instead.
      - name: Keep installers (build only)
        if: ${{ !(github.event_name != 'workflow_dispatch' || inputs.publish) }}
        uses: actions/upload-artifact@v4
        with:
          name: greencli-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/**
          if-no-files-found: error
