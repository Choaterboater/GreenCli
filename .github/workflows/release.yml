name: Release

# Builds signed-able installers for macOS (.dmg/.app) and Windows (.msi/.exe NSIS)
# and uploads them to a draft GitHub Release. Triggered by pushing a v* tag, or
# manually via the Actions tab.
#
# Update files are signed with the owner's key: the TAURI_SIGNING_PRIVATE_KEY /
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD repo secrets. The app has the public half
# built in (tauri.conf.json plugins.updater.pubkey) and never downloads a key
# (src-tauri/src/updater.rs). Update files are made only when both the secret
# and the built-in public key are set; until then builds still succeed, with
# no update files, and the app has updates off. The update-files job checks
# the whole release against the built-in key before the owner publishes the
# draft.
on:
  push:
    tags:
      - "v*"
    # Pushing a release/* branch also builds — the escape hatch for
    # environments whose credentials can push branches but not tags or
    # workflow_dispatch. The release lands under the app's real version
    # (v__VERSION__ below), not the branch name.
    branches:
      - "release/**"
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload to a draft GitHub Release (off: build only, installers kept as workflow artifacts)"
        type: boolean
        default: true

# Read-only by default; only the job that uploads to the release gets write.
permissions:
  contents: read

jobs:
  # The full test/lint gate (ci.yml) must pass before any installer is built.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: ci
    # tauri-action creates the draft release and uploads the installers.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon + Intel macOS
          # `updater` is the <os>-<arch> name Tauri uses in latest.json (the
          # update-files job checks each one is there). updater.rs tests check
          # these names against the app's.
          - platform: macos-latest
            target: aarch64-apple-darwin
            updater: darwin-aarch64
          - platform: macos-latest
            target: x86_64-apple-darwin
            updater: darwin-x86_64
          # Windows x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            updater: windows-x86_64

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      # Update files only when the owner's signing key (repo secret) and the
      # public key built into the app (tauri.conf.json) are both set. The
      # secret is only tested for being empty here, never printed or written.
      - name: Update signing
        id: upd
        shell: bash
        env:
          HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          key="$(node scripts/update-signature.mjs config-key src-tauri/tauri.conf.json)"
          if [ -n "$key" ] && [ "$HAS_SIGNING_KEY" = true ]; then
            # Forward slashes: the path goes into tauri-action's args on Windows.
            conf="${RUNNER_TEMP//\\//}/greencli-updater.conf.json"
            echo '{"bundle":{"createUpdaterArtifacts":true}}' > "$conf"
            printf '%s\n' "$key" > "${RUNNER_TEMP//\\//}/greencli-update.pub"
            echo "on=true" >> "$GITHUB_OUTPUT"
            echo "args=--config $conf" >> "$GITHUB_OUTPUT"
          elif [ -n "$key" ]; then
            echo "::warning::The app has an update key but the signing key secret is empty: this release has no update files."
            echo "on=false" >> "$GITHUB_OUTPUT"
          else
            if [ "$HAS_SIGNING_KEY" = true ]; then
              echo "::warning::The signing key secret is set but tauri.conf.json has no plugins.updater.pubkey: no update files, and updates stay off in this build."
            else
              echo "::notice::No update key yet: no update files, and updates stay off in this build."
            fi
            echo "on=false" >> "$GITHUB_OUTPUT"
          fi

      # NOTARIZATION TEMPORARILY DISABLED (2026-06-06): the APPLE_ID /
      # APPLE_PASSWORD secrets fail Apple auth with HTTP 401 (APPLE_PASSWORD is
      # 20 chars; an app-specific password is exactly 19: xxxx-xxxx-xxxx-xxxx).
      # Apps are still SIGNED with the Developer ID cert — users just have to
      # approve the first launch via System Settings > Privacy & Security.
      #
      # To re-enable: regenerate an app-specific password at account.apple.com,
      # re-set the APPLE_ID and APPLE_PASSWORD repo secrets (from the
      # Choaterboater account), then uncomment this preflight step AND the
      # three APPLE_ID/APPLE_PASSWORD/APPLE_TEAM_ID env lines on the
      # tauri-action step below.
      #
      # The Tauri bundler can hide notarytool's real stderr behind a generic
      # "failed to upload app to Apple's notarization servers." — this step
      # validates the Apple ID / app-specific password / Team ID triple up
      # front so the actual Apple error (e.g. HTTP 401) shows in the log.
      # Values are passed via env and never echoed; only lengths are printed.
      # - name: Preflight - validate Apple notarization credentials
      #   if: runner.os == 'macOS'
      #   env:
      #     APPLE_ID: ${{ secrets.APPLE_ID }}
      #     APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      #     APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      #   run: |
      #     set -euo pipefail
      #     : "${APPLE_ID:?APPLE_ID secret is empty or unset}"
      #     : "${APPLE_PASSWORD:?APPLE_PASSWORD secret is empty or unset}"
      #     : "${APPLE_TEAM_ID:?APPLE_TEAM_ID secret is empty or unset}"
      #     echo "APPLE_ID length: ${#APPLE_ID}; APPLE_PASSWORD length: ${#APPLE_PASSWORD} (expect 19); APPLE_TEAM_ID length: ${#APPLE_TEAM_ID} (expect 10)"
      #     # Real auth round-trip with Apple; prints Apple's native error on failure.
      #     xcrun notarytool history \
      #       --apple-id "$APPLE_ID" \
      #       --password "$APPLE_PASSWORD" \
      #       --team-id "$APPLE_TEAM_ID"
      #     echo "Notarization credentials validated successfully."

      - name: Build + bundle (tauri-action)
        id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS runners have 7 GB RAM, so Node 20 sizes its default old-space
          # heap near 2 GB and `vite build` (the beforeBuildCommand) aborts with
          # "JavaScript heap out of memory". Linux/Windows runners have 16 GB and
          # get a 4 GB default, which is why only the macOS legs failed.
          NODE_OPTIONS: --max-old-space-size=4096
          # macOS signing (notarization disabled — see comment above; presence
          # of APPLE_ID/APPLE_PASSWORD is what makes Tauri attempt notarization)
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows code signing:
          # WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          # WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          # The owner's update signing key, only when update files are on.
          TAURI_SIGNING_PRIVATE_KEY: ${{ steps.upd.outputs.on == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ steps.upd.outputs.on == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        with:
          # The Tauri app lives at the repo root (this `project/` folder).
          # Publishing is on for tag and release/** pushes, and for manual
          # runs unless "publish" is unticked. The test is
          #   github.event_name != 'workflow_dispatch' || inputs.publish
          # because `inputs.publish` is null on push events. With publishing
          # off, tagName and releaseName are empty, so nothing is uploaded to
          # any release (the installers become workflow artifacts below).
          # Why manual runs can turn it off: a run builds under the app's
          # current version (tauri-action substitutes __VERSION__ from
          # tauri.conf.json), so before the version bump it would add files
          # to the already published release of that version (e.g. v1.9.0).
          # A release/** push always publishes: push one only after the bump.
          tagName: ${{ (github.event_name != 'workflow_dispatch' || inputs.publish) && (github.ref_type == 'tag' && github.ref_name || 'v__VERSION__') || '' }}
          releaseName: ${{ (github.event_name != 'workflow_dispatch' || inputs.publish) && (github.ref_type == 'tag' && format('GreenCli {0}', github.ref_name) || 'GreenCli v__VERSION__') || '' }}
          # Always a draft: no CI run can make a release "latest" by itself.
          # The owner publishes the draft by hand.
          releaseDraft: true
          prerelease: false
          # Update files: tauri-action writes latest.json into the release,
          # or adds this build's platforms to the one already there. The
          # Windows default entry is the NSIS installer.
          uploadUpdaterJson: ${{ steps.upd.outputs.on == 'true' }}
          updaterJsonPreferNsis: true
          args: --target ${{ matrix.target }} ${{ steps.upd.outputs.args }}

      # Every update file must match the public key built into the app.
      - name: Check the update signatures
        if: ${{ steps.upd.outputs.on == 'true' }}
        shell: bash
        run: >-
          node scripts/update-signature.mjs verify-dir
          "src-tauri/target/${{ matrix.target }}/release/bundle"
          "${RUNNER_TEMP//\\//}/greencli-update.pub"

      # Build only: keep the installers as workflow artifacts instead.
      - name: Keep installers (build only)
        if: ${{ !(github.event_name != 'workflow_dispatch' || inputs.publish) }}
        uses: actions/upload-artifact@v4
        with:
          name: greencli-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/**
          if-no-files-found: error

  # After all three builds: latest.json in the draft must list every platform
  # and point at files of this release, and every signature must match its
  # file and the public key built into the app (from this commit's
  # tauri.conf.json, not from the release). Publish the draft only when this
  # is green. (If a build leg is re-run, re-run this job too.) Skipped, green,
  # while there is no update key.
  update-files:
    needs: build
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
    runs-on: ubuntu-latest
    # Read-only work, but draft releases are only visible with write access.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check latest.json and the update signatures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          node scripts/update-signature.mjs config-key src-tauri/tauri.conf.json > "$RUNNER_TEMP/update.pub"
          if [ ! -s "$RUNNER_TEMP/update.pub" ] || [ "$HAS_SIGNING_KEY" != true ]; then
            echo "::notice::No update files in this release (no update key): nothing to check."
            exit 0
          fi
          # The release tag: the pushed tag, or v<app version> (tauri-action's v__VERSION__).
          if [ "$REF_TYPE" = tag ]; then tag="$REF_NAME"; else tag="v$(jq -r .version src-tauri/tauri.conf.json)"; fi
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=50" \
            --jq "[.[] | select(.tag_name == \"$tag\")][0].id // empty")
          if [ -z "$id" ]; then echo "::error::No release for $tag"; exit 1; fi
          gh api "repos/$GITHUB_REPOSITORY/releases/$id/assets?per_page=100" > "$RUNNER_TEMP/assets.json"
          dir="$RUNNER_TEMP/release"
          mkdir -p "$dir"
          get() {
            local aid
            aid=$(jq -r --arg n "$1" '[.[] | select(.name == $n)][0].id // empty' "$RUNNER_TEMP/assets.json")
            if [ -z "$aid" ]; then echo "::error::The $tag release has no $1"; exit 1; fi
            gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$aid" > "$dir/$1"
          }
          get latest.json
          node scripts/update-signature.mjs release-files "$dir/latest.json" \
            "$RUNNER_TEMP/assets.json" "$GITHUB_REPOSITORY" "$tag" > "$RUNNER_TEMP/files.txt"
          while read -r f; do get "$f"; done < "$RUNNER_TEMP/files.txt"
          node scripts/update-signature.mjs check-release "$dir" "$RUNNER_TEMP/update.pub" \
            "$RUNNER_TEMP/assets.json" "$GITHUB_REPOSITORY" "$tag" \
            darwin-aarch64 darwin-x86_64 windows-x86_64 windows-x86_64-msi windows-x86_64-nsis
