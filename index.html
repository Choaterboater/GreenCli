<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- First-paint background: the webview paints white before CSS arrives,
         which flashed at every launch. Match the persisted theme inline so the
         very first frame already has the app's background. 'system' (and a
         fresh install, which defaults to it) follows the OS appearance. -->
    <script>
      (function () {
        var bg = "#0a0e14";
        try {
          var s = JSON.parse(localStorage.getItem("atp-settings") || "{}");
          var t = (s.state || s).theme;
          var osLight = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
          if (t === "light" || ((!t || t === "system") && osLight)) bg = "#ffffff";
        } catch (e) { /* default to dark */ }
        document.documentElement.style.background = bg;
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/terminal.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GreenCLI</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
