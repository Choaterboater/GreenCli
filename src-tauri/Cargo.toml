[package]
name = "green-cli"
version = "1.9.0"
description = "Multi-vendor SSH/Telnet/Serial terminal for network engineers"
authors = ["ChoateLabs"]
license = "MIT"
repository = "https://github.com/Choaterboater/GreenCli"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Open/Save dialogs and clipboard text (the only plugin APIs the frontend uses;
# what it may call is limited by capabilities/default.json).
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1.0", features = ["derive"] }
# float_roundtrip: parse floats exactly like JSON.parse, so the MCP checks in TS and Rust agree on
# which JSON text is readable (labels.rs read_json_text vs mcpApproval.ts readJsonText).
# preserve_order: objects keep their key order, like JS objects in the TS checks. Tauri 1
# turned this on for us; Tauri 2 does not, so it is set here (labels.rs tests rely on it).
serde_json = { version = "1.0", features = ["float_roundtrip", "preserve_order"] }
tokio = { version = "1.35", features = ["full"] }
tokio-serial = "5.4"
async-trait = "0.1"
futures = "0.3"
# This computer's host name (a saved web MCP server named after it counts as local).
gethostname = "1.1"
# default crypto backend is aws-lc-rs (needs NASM on Windows). `ring` is the
# portable backend that builds on the Windows MSVC toolchain and ubuntu-22.04 CI.
russh = { version = "0.63.1", default-features = false, features = ["flate2", "ring", "rsa"] }
russh-sftp = "2.4"
aes-gcm = "0.10"
argon2 = "0.5"
zeroize = { version = "1", features = ["serde"] }
rand = "0.8"
# ssh-key 0.7 (via russh 0.63) needs rand_core 0.10 CryptoRng; rand 0.8 does not implement it.
rand_os = { package = "rand", version = "0.10" }
base64 = "0.21"
log = "0.4"
env_logger = "0.11"
serialport = "4.3"
portable-pty = "0.8"
# chrono = "0.4"  # unused
# directories-next = "2.0"  # unused
reqwest = { version = "0.12", features = ["json", "cookies", "stream"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Opt-in RSA key generation (for legacy network gear). Off by default.
# russh 0.63 ships RSA via the `rsa` feature (on by default); this flag only
# un-gates our generator, it no longer pulls openssl.
rsa-keys = []

# [2.0 keys] keyring tables go below.
#
# AI keys and MCP logins live in the system password store (secret_store.rs).
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

# The Secret Service over D-Bus (needs libdbus-1-dev and pkg-config to build).
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

